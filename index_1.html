const slug=s=>String(s).toLowerCase().trim().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
const hash=s=>{let h=5381;for(const c of String(s))h=((h<<5)+h+c.charCodeAt(0))|0;return (h>>>0).toString(36)};
const lsGet=k=>{try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const lsDel=k=>{try{localStorage.removeItem(k)}catch(e){}};
let toastT;function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove("on"),1800)}

function csv(text){
  const rows=[];let row=[],f="",q=false;
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
    else if(c==='"')q=true;else if(c===","){row.push(f);f=""}
    else if(c==="\n"||c==="\r"){if(c==="\r"&&text[i+1]==="\n")i++;row.push(f);rows.push(row);row=[];f=""}
    else f+=c}
  if(f!==""||row.length){row.push(f);rows.push(row)}
  const clean=rows.filter(r=>r.some(x=>x.trim()!==""));
  if(!clean.length)return[];
  const h=clean[0].map(x=>x.trim());
  return clean.slice(1).map(r=>{const o={};h.forEach((k,i)=>{if(k)o[k]=(r[i]??"").trim()});return o});
}
function rupiah(v){v=String(v??"").trim().replace(/[.,]0{1,2}$/,"");if(!v)return null;
  const d=v.replace(/[^\d]/g,"");return d?parseInt(d,10):null}
function persen(v){v=String(v??"").trim();if(!v)return null;
  const hasP=v.includes("%");const n=parseFloat(v.replace("%","").replace(",","."));
  if(isNaN(n))return null;return(!hasP&&n>0&&n<1)?n*100:n}
const truthy=v=>/^(ya|y|yes|true|1|tolak|x)$/i.test(String(v??"").trim());

/* ====== data ====== */
let D=null;      // {models:[], groups:[], cfg:{}, t, src}
let S=lsGet(LS.sel)||{};  // pilihan: {model, storage, varian, g:{grup:[idx...]}}

function build(raw){
  const cfg={};csv(raw.config).forEach(r=>{const k=(r.kunci||"").toLowerCase().trim();if(k)cfg[k]=r.nilai??""});
  const hr=csv(raw.harga);
  const fixed=["model","storage","gambar","pakai_persen"];
  const keys=hr.length?Object.keys(hr[0]):[];
  const varCols=keys.filter(k=>!fixed.includes(k.toLowerCase()));
  const models=[];const byName={};
  hr.forEach(r=>{
    const name=(r.model||"").trim();if(!name)return;
    let m=byName[name];
    if(!m){m=byName[name]={name,img:(r.gambar||"").trim(),pct:false,rows:[]};models.push(m)}
    if(truthy(r.pakai_persen))m.pct=true;
    if(!m.img&&r.gambar)m.img=r.gambar.trim();
    const st=(r.storage||"").trim().replace(/^(\d+)$/,"$1GB")||"-";
    const v={};varCols.forEach(c=>{const p=rupiah(r[c]);if(p!=null&&p>0)v[c]=p});
    if(Object.keys(v).length)m.rows.push({storage:st,v});
  });
  const groups=[];const gBy={};
  csv(raw.potongan).forEach(r=>{
    const g=(r.grup||"").trim(),label=(r.pilihan||"").trim();if(!g||!label)return;
    let G=gBy[g];
    if(!G){G=gBy[g]={name:g,type:/pilih|radio|satu/i.test(r.tipe||"")?"pilih":"centang",opts:[]};groups.push(G)}
    G.opts.push({label,rp:rupiah(r.potongan_rp)||0,pct:persen(r.potongan_persen)||0,tolak:truthy(r.tolak),ket:(r.keterangan||"").trim()});
  });
  return {models:models.filter(m=>m.rows.length),varCols,groups,cfg};
}

async function fetchTab(name){
  const u=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&headers=1&sheet=${encodeURIComponent(name)}&_=${Date.now()}`;
  const ctl=new AbortController();const t=setTimeout(()=>ctl.abort(),9000);
  try{const r=await fetch(u,{signal:ctl.signal,cache:"no-store"});
    if(!r.ok)throw new Error("HTTP "+r.status);
    const tx=await r.text();
    if(/^\s*</.test(tx))throw new Error("Sheet belum dibagikan publik");
    return tx}finally{clearTimeout(t)}
}

async function load(force){
  const rb=$("#rfB");rb.classList.add("spin");
  if(!SHEET_ID){
    apply({...DEMO,t:Date.now(),src:"demo"});
    setUpd("off","Mode contoh — SHEET_ID belum diisi");
    rb.classList.remove("spin");return;
  }
  const cache=lsGet(LS.data);
  if(cache&&!D&&!force)apply(cache,true);
  if(!cache)setUpd("","Memuat harga…");
  try{
    const [harga,potongan,config]=await Promise.all([fetchTab(TABS.harga),fetchTab(TABS.potongan),fetchTab(TABS.config)]);
    const raw={harga,potongan,config,t:Date.now(),src:"sheet"};
    const changed=!cache||cache.harga!==harga||cache.potongan!==potongan||cache.config!==config;
    lsSet(LS.data,raw);
    if(changed||!D)apply(raw);
    setUpd("on","Harga terbaru · dicek "+when(raw.t));
    if(force)toast(changed?"Harga diperbarui":"Harga sudah terbaru");
  }catch(e){
    if(cache){if(!D)apply(cache);setUpd("off","Offline — pakai data tersimpan "+when(cache.t));if(force)toast("Gagal terhubung, pakai data tersimpan")}
    else{setUpd("err","Gagal memuat harga");$("#form").innerHTML=`<div class="intro e"><b>Harga belum bisa dimuat.</b><div class="d">${esc(e.message)}. Pastikan ada sinyal dan Google Sheet sudah dibagikan “Siapa saja yang memiliki link”.</div><button type="button" class="p" onclick="load(true)">Coba lagi</button></div>`}
  }finally{rb.classList.remove("spin")}
}
function when(t){const d=new Date(t);const now=new Date();
  const hm=d.toLocaleTimeString("id-ID",{hour:"2-digit",minute:"2-digit"});
  return d.toDateString()===now.toDateString()?hm:d.toLocaleDateString("id-ID",{day:"numeric",month:"short"})+" "+hm}
function setUpd(cls,t){const u=$("#upd");u.className="upd "+cls;$("#updT").textContent=t}

function apply(raw){
  D=build(raw);D.t=raw.t;D.src=raw.src;
  document.title="Authn.id "+(D.cfg.judul||"Harga iPhone");
  document.querySelector("header .brand").lastChild.textContent=D.cfg.judul||"Harga iPhone";
  checkLock();
  sanitize();render();
}

/* ====== pilihan ====== */
const curModel=()=>D&&D.models.find(m=>m.name===S.model);
const curRow=()=>{const m=curModel();return m&&m.rows.find(r=>r.storage===S.storage)};
function sanitize(){
  S.g=S.g||{};
  const m=curModel();if(!m){S.model=null;S.storage=null;S.varian=null}
  if(m&&!m.rows.some(r=>r.storage===S.storage))S.storage=m.rows.length===1?m.rows[0].storage:null;
  const r=curRow();
  if(!r)S.varian=null;else if(!(S.varian in r.v)){const k=Object.keys(r.v);S.varian=k.length===1?k[0]:null}
  for(const k of Object.keys(S.g)){const G=D.groups.find(g=>g.name===k);
    if(!G){delete S.g[k];continue}
    S.g[k]=S.g[k].filter(i=>i<G.opts.length&&G.opts[i].label!==undefined);
    if(G.type==="pilih")S.g[k]=S.g[k].slice(0,1)}
}
const save=()=>lsSet(LS.sel,S);

function imgFor(m){
  if(!m)return"";
  if(m.img)return /^https?:/.test(m.img)?m.img:IMG_BASE+m.img;
  let s=slug(m.name);
  while(s){if(IMG[s])return IMG_BASE+IMG[s];const n=s.replace(/-(max|plus|mini|pro)$/,"");if(n===s)break;s=n}
  return"";
}
const imgTag=(m,cls)=>{const u=imgFor(m);return u?`<img src="${esc(u)}" alt="" loading="lazy" onload="this.classList.add('ld')" onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'ph',textContent:'📱'}))">`:`<span class="ph">📱</span>`};
const minPrice=m=>Math.min(...m.rows.flatMap(r=>Object.values(r.v)));
const maxPrice=m=>Math.max(...m.rows.flatMap(r=>Object.values(r.v)));
/* Potongan: nominal (potongan_rp). Model yang ditandai pakai_persen memakai potongan_persen kalau diisi, sebagai pengganti nominal. */
const usePct=o=>{const m=curModel();return !!(m&&m.pct&&o.pct>0)};
const cut=(o,base)=>o.tolak?0:usePct(o)?base*o.pct/100:o.rp;

/* ====== render ====== */
function render(){
  const note=$("#note");
  note.innerHTML=D.cfg.catatan?`<div class="intro ${D.src==="demo"||/contoh|⚠/i.test(D.cfg.catatan)?"w":""}">${esc(D.cfg.catatan)}</div>`:"";
  if(!D.models.length){$("#form").innerHTML=`<div class="intro e"><b>Tab “harga” masih kosong.</b><div class="d">Isi minimal satu baris model + storage + harga di Google Sheet.</div></div>`;calc();return}
  const m=curModel(),r=curRow();
  let h=`<h2>Unit</h2>`;
  h+=`<div class="item ${m?"ok":""}" id="it_model"><div class="t">Model</div>
    <button type="button" class="mpick" id="mOpen"><span class="mi">${m?imgTag(m):`<span class="ph">📱</span>`}</span>
    <span class="mt"><b>${m?esc(m.name):"Pilih model iPhone"}</b><small>${m?`${fmt(minPrice(m))} – ${fmt(maxPrice(m))}`:`${D.models.length} model tersedia`}</small></span><span class="mc">${m?"Ganti":"Pilih"} ▾</span></button></div>`;
  if(m){
    h+=`<div class="item ${S.storage?"ok":""}" id="it_storage"><div class="t">Kapasitas</div><div class="opts">`+
      m.rows.map(x=>`<label><input type="radio" name="st" value="${esc(x.storage)}" ${x.storage===S.storage?"checked":""}><span>${esc(x.storage)}</span></label>`).join("")+`</div></div>`;
  }
  if(r){
    h+=`<div class="item ${S.varian?"ok":""}" id="it_varian"><div class="t">Garansi / varian</div><div class="opts">`+
      D.varCols.map(c=>{const p=r.v[c];return `<label><input type="radio" name="vr" value="${esc(c)}" ${c===S.varian?"checked":""} ${p?"":"disabled"}><span>${esc(c)}<small>${p?fmt(p):"tidak diambil"}</small></span></label>`}).join("")+`</div></div>`;
  }
  if(r&&S.varian){
    const base=r.v[S.varian];
    h+=`<h2>Kondisi</h2>`;
    D.groups.forEach((G,gi)=>{
      const sel=S.g[G.name]||[];
      const anyTolak=sel.some(i=>G.opts[i].tolak),anyCut=sel.some(i=>cut(G.opts[i],base)>0);
      const st=anyTolak?"cx":anyCut?"bad":(G.type==="pilih"&&sel.length)||(G.type==="centang"&&sel.length===0&&S.g[G.name])?"ok":"";
      const opts=G.opts;const wide=opts.some(o=>o.label.length>18);
      h+=`<div class="item ${st}" id="it_g${gi}"><div class="t">${esc(G.name)}</div>${G.type==="centang"?`<div class="d">Centang yang ada saja. Kosong = tidak ada minus.</div>`:""}<div class="opts ${G.type==="centang"?"l":wide?"w":""}">`+
        opts.map((o,i)=>{const on=sel.includes(i);const c=cut(o,base);const k=o.tolak?"c":c>0?"b":"";
          const lab=G.type==="pilih"
            ?`<span>${esc(o.label)}<small>${o.tolak?"Tolak":c>0?"−"+short(c):"±0"}</small></span>`
            :`<span><em>${esc(o.label)}${o.ket?`<small class="kt">${esc(o.ket)}</small>`:""}</em><small>${o.tolak?"Tolak":"−"+short(c)}</small></span>`;
          return `<label class="${G.type==="centang"?"ck":""}"><input type="${G.type==="pilih"?"radio":"checkbox"}" class="${k}" name="g${gi}" data-g="${gi}" value="${i}" ${on?"checked":""}>${lab}</label>`}).join("")+`</div></div>`;
    });
  }
  $("#form").innerHTML=h;
  calc();
}

function calc(){
  const r=curRow(),m=curModel();
  const need=[];
  if(!D.models.length){R={need:[],tolak:[]};$("#fv").className="inc";$("#fv").textContent="Data kosong";$("#pb").style.width="0";return}
  if(!m)need.push("it_model");else if(!r)need.push("it_storage");else if(!S.varian)need.push("it_varian");
  let base=0,lines=[],tolak=[];
  if(r&&S.varian){
    base=r.v[S.varian];
    D.groups.forEach((G,gi)=>{const sel=S.g[G.name]||[];
      if(G.type==="pilih"&&!sel.length)need.push("it_g"+gi);
      sel.forEach(i=>{const o=G.opts[i];if(o.tolak)tolak.push({G,o});else{const c=cut(o,base);lines.push({G,o,c})}})});
  }
  const pil=D.groups.filter(g=>g.type==="pilih");
  const done=(m?1:0)+(r?1:0)+(r&&S.varian?1+pil.filter(g=>(S.g[g.name]||[]).length).length:0);
  $("#pb").style.width=Math.round(100*done/(3+pil.length))+"%";
  const potong=lines.reduce((a,x)=>a+x.c,0);
  const step=rupiah(D.cfg.pembulatan)||0;
  let maks=Math.max(0,base-potong);if(step>0)maks=Math.floor(maks/step)*step;
  const tp=persen(D.cfg.tawar_awal_persen)||0;
  let awal=tp>0?maks*(1-tp/100):0;if(step>0)awal=Math.floor(awal/step)*step;
  R={m,r,base,lines,tolak,potong,maks,awal,need};
  const fv=$("#fv"),fk=$("#fk");const prev=fv.textContent;
  fv.className="";
  if(!D.models.length){fv.className="inc";fv.textContent="Data kosong";fk.textContent="Harga ambil maksimal"}
  else if(tolak.length){fv.className="cx";fv.textContent="Jangan diambil";fk.textContent=tolak[0].o.label}
  else if(need.length){fv.className="inc";fk.textContent=base?`Sementara ${fmt(maks)}`:"Harga ambil maksimal";
    fv.textContent=!m?"Pilih model dulu":!r?"Pilih kapasitas":!S.varian?"Pilih varian":`${need.length} poin lagi`}
  else{fv.textContent=fmt(maks);fk.textContent=awal?`Buka tawar ${fmt(awal)}`:"Harga ambil maksimal"}
  if(prev!==fv.textContent&&!need.length){fv.classList.remove("bump");void fv.offsetWidth;fv.classList.add("bump")}
}
let R={};

function showRes(){

  else{sum.className=lines.some(x=>x.c>0)?"b":"";
    sum.innerHTML=`<div class="rk">${esc(title)}</div><div class="rv">${fmt(maks)}</div><div class="ru">Harga ambil maksimal</div>`+
      `<div class="rt">${awal?`<span>Buka tawar ${fmt(awal)}</span>`:""}<span>Potongan ${fmt(potong)}</span></div>`}
  let h=`<div class="rr" style="--d:0ms"><span>Harga dasar<small>${esc(title)}</small></span><b>${fmt(base)}</b></div>`;let d=40;
  D.groups.forEach(G=>{(S.g[G.name]||[]).forEach(i=>{const o=G.opts[i];const c=cut(o,base);
    if(!o.tolak&&c<=0&&G.type==="pilih"){h+=`<div class="rr" style="--d:${d}ms"><span>${esc(G.name)}<small>${esc(o.label)}</small></span><b>±0</b></div>`;d+=40;return}
    h+=`<div class="rr ${o.tolak?"x":"m"}" style="--d:${d}ms"><span>${esc(G.name)}<small>${esc(o.label)}${usePct(o)?` (${o.pct}%)`:""}</small></span><b>${o.tolak?"Tolak":"−"+fmt(c)}</b></div>`;d+=40})});

    if(step>0&&raw!==maks){h+=`<div class="rr" style="--d:${d}ms"><span>Pembulatan ke bawah<small>kelipatan ${fmt(step)}</small></span><b>−${fmt(raw-maks)}</b></div>`;d+=40}
    h+=`<div class="rr t" style="--d:${d}ms"><span>Harga ambil maksimal</span><b>${fmt(maks)}</b></div>`}
  $("#rl").innerHTML=h;
  $("#rnote").textContent=(D.src==="demo"?"Mode contoh · ":"")+"Data harga: "+when(D.t);
  openSheet("#res");
}
function resText(){
  const {m,r,base,lines,tolak,maks,awal}=R;
  const L=[`*${m.name} ${r.storage} · ${S.varian}*`,`Harga dasar: ${fmt(base)}`];
  D.groups.forEach(G=>{(S.g[G.name]||[]).forEach(i=>{const o=G.opts[i];const c=cut(o,base);
    L.push(`- ${G.name}: ${o.label}${o.tolak?" → TOLAK":c>0?` (−${fmt(c)}${usePct(o)?`, ${o.pct}%`:""})`:""}`)})});
  if(tolak.length)L.push("","*JANGAN DIAMBIL*");
  else{L.push("",`*Harga ambil maks: ${fmt(maks)}*`);if(awal)L.push(`Buka tawar: ${fmt(awal)}`)}
  L.push(`(data harga ${when(D.t)})`);return L.join("\n");
}
